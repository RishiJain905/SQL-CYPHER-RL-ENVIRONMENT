# Copy to configs/paths.local.toml (git-ignored) and fill in this machine's paths.
# Tracked files hold only placeholders: real paths never go into git (CLAUDE.md -> Security).

[paths]
# Where this repo's runs go (outside the repo).
data = '<drive>:\<data folder>\rl'
# The released model's Q8_0 GGUF.
model = '<drive>:\<folder>\Spark-X2.6-4B-SQL-Cypher-Agent-Q8_0.gguf'
# The trainer's held-out evalset (200 questions, `ask-trainer traces evalset`).
evalset = '<drive>:\<folder>\evalset\examples_val.jsonl'
# The released model's greedy evalset scores (checker 4), for pass@1.
greedy_scores = '<drive>:\<folder>\scores_llamacpp_release-eval-Q8_0.json'
# The trainer repo (its llama-server script and its checker, used as a library).
trainer_repo = '<drive>:\<folder>\nfl-ask-trainer'
# The trainer's venv inside WSL (it has the checker's dependencies, W&B and pytest).
wsl_venv = '~/venvs/<venv>'
# Step 2: the released model, merged bf16 (the RL trainer's starting weights) and its Q8_0
# (the rollout server's), copied to a fast disk.
model_hf = '<drive>:\<folder>\Spark-X2.6-4B-SQL-Cypher-Agent'
model_gguf = '<drive>:\<folder>\Spark-X2.6-4B-SQL-Cypher-Agent-Q8_0.gguf'
# A llama.cpp source tree with Spark support (its convert_lora_to_gguf.py and gguf-py).
llama_cpp_src = '<drive>:\<folder>\llama.cpp'
# Run 1: the llama.cpp build's `bin` folder (llama-server.exe), the ROCm `bin` folder (its
# DLLs) and the discrete GPU's HIP index (0 when there is no integrated GPU).
llama_bin = '<drive>:\<folder>\llama.cpp\build\bin'
rocm_bin = '<drive>:\<folder>\ROCm\<version>\bin'
hip_device = '1'
# Optional: a copy of `model_hf` on WSL's own disk (a WSL path). Used when it is in WSL's file
# cache (the run keeps it there): the update's model load takes ~20 s instead of ~58 s.
model_hf_wsl = '~/models/Spark-X2.6-4B-SQL-Cypher-Agent'
